<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>혀기🐶 Archive - Calendar & Gallery</title>
  <style>
    :root {
      --bg: #fffaf5;
      --card: #ffffff;
      --orange: #ff7b29;
      --orange-hover: #e86617;
      --orange-soft: #fff0e5;
      --text: #2b2623;
      --muted: #9e9189;
      --border: #f0e2d8;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", "Apple SD Gothic Neo", sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 24px 16px 64px;
    }
    .container {
      max-width: 780px;
      margin: 0 auto;
    }
    .top-bar {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 18px;
    }
    .back-link {
      text-decoration: none;
      color: var(--muted);
      font-weight: 700;
      font-size: 0.92rem;
    }
    .back-link:hover { color: var(--orange); }
    .mode-switch {
      display: flex;
      gap: 8px;
    }
    .mode-btn {
      padding: 7px 14px;
      border-radius: 12px;
      border: 1.5px solid var(--border);
      background: var(--card);
      color: var(--text);
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
    }
    .mode-btn.active {
      background: var(--orange);
      border-color: var(--orange);
      color: #fff;
    }

    .nav-panel {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 14px 18px;
      margin-bottom: 18px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .year-tabs {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }
    .year-pill {
      padding: 5px 11px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: #fffdfb;
      color: var(--text);
      font-weight: 700;
      font-size: 0.85rem;
      cursor: pointer;
    }
    .year-pill.active {
      background: var(--orange-soft);
      border-color: var(--orange);
      color: var(--orange);
    }
    .month-controls {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .month-btn {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      font-weight: 800;
      cursor: pointer;
    }
    .month-btn:hover {
      border-color: var(--orange);
      color: var(--orange);
    }
    .month-label {
      font-size: 1.05rem;
      font-weight: 800;
      min-width: 110px;
      text-align: center;
    }

    /* 月曆樣式 */
    .calendar-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 20px;
      box-shadow: 0 8px 24px rgba(255, 123, 41, 0.05);
    }
    .weekdays {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      text-align: center;
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--muted);
      margin-bottom: 10px;
    }
    .days-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 8px;
    }
    .day-cell {
      aspect-ratio: 1 / 1;
      border-radius: 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      font-weight: 700;
      font-size: 0.95rem;
      border: 1px solid transparent;
    }
    .day-cell.empty { background: transparent; }
    .day-cell.inactive {
      color: #d4cbc5;
      background: #fcfaf8;
      cursor: default;
    }
    .day-cell.active {
      background: var(--orange-soft);
      color: var(--text);
      border-color: #ffd1b3;
      text-decoration: none;
      cursor: pointer;
      transition: transform 0.12s, background 0.15s;
    }
    .day-cell.active:hover {
      background: var(--orange);
      color: #fff;
      transform: translateY(-2px);
    }
    .day-cell.birthday-day .day-num {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
    }
    .day-cell.birthday-day .day-num::after {
      content: "";
      width: 18px;
      height: 5px;
      border-radius: 999px;
      background: #ff5e1a;
      margin-top: 3px;
    }
    .day-dots {
      display: flex;
      gap: 3px;
      margin-top: 4px;
      height: 6px;
    }
    .dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--orange);
    }
    .day-cell.active:hover .dot { background: #fff; }

    /* Gallery 雙分類媒體庫樣式 */
    .gallery-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 20px;
      box-shadow: 0 8px 24px rgba(255, 123, 41, 0.05);
    }
    .gallery-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 18px;
    }
    .gallery-month-badge {
      font-size: 1.35rem;
      font-weight: 900;
      letter-spacing: 1px;
      color: var(--orange);
      background: var(--orange-soft);
      padding: 6px 16px;
      border-radius: 12px;
    }
    .filter-tabs {
      display: flex;
      gap: 8px;
    }
    .filter-btn {
      padding: 7px 14px;
      border-radius: 12px;
      border: 1.5px solid var(--border);
      background: #fffdfb;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
    }
    .filter-btn.active {
      background: var(--orange);
      border-color: var(--orange);
      color: #fff;
    }
    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(185px, 1fr));
      gap: 12px;
    }
    .media-tile {
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
      background: #fffdfb;
      display: flex;
      flex-direction: column;
    }
    .media-tile img, .media-tile video {
      width: 100%;
      height: 175px;
      object-fit: cover;
      display: block;
      background: #f5ece6;
      cursor: pointer;
    }
    .voice-tile {
      height: 175px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px;
      background: var(--orange-soft);
    }
    .voice-tile audio {
      width: 100%;
      height: 32px;
    }
    .tile-meta {
      padding: 8px 10px;
      font-size: 0.78rem;
      color: var(--muted);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
    }
    .tile-meta a {
      color: var(--orange);
      text-decoration: none;
      font-weight: 700;
    }
    .empty-msg {
      text-align: center;
      color: var(--muted);
      padding: 36px 12px;
      font-size: 0.95rem;
    }

    /* 燈箱放大 */
    .lightbox {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 99;
      padding: 20px;
    }
    .lightbox.open { display: flex; }
    .lightbox img, .lightbox video {
      max-width: 92vw;
      max-height: 86vh;
      border-radius: 14px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="top-bar">
      <a class="back-link" href="years.html">← 年份與那年今日</a>
      <div class="mode-switch">
        <button class="mode-btn active" id="btnCalendarMode">Calendar</button>
        <button class="mode-btn" id="btnGalleryMode">Gallery</button>
      </div>
    </div>

    <div class="nav-panel">
      <div class="year-tabs" id="yearTabs">
        <button class="year-pill" data-year="2022">2022</button>
        <button class="year-pill" data-year="2023">2023</button>
        <button class="year-pill" data-year="2024">2024</button>
        <button class="year-pill" data-year="2025">2025</button>
        <button class="year-pill" data-year="2026">2026</button>
      </div>
      <div class="month-controls">
        <button class="month-btn" id="prevMonth">‹</button>
        <div class="month-label" id="monthLabel">2026 · 1月</div>
        <button class="month-btn" id="nextMonth">›</button>
      </div>
    </div>

    <!-- Calendar 視圖 -->
    <section class="calendar-card" id="calendarView">
      <div class="weekdays">
        <div>SUN</div><div>MON</div><div>TUE</div><div>WED</div><div>THU</div><div>FRI</div><div>SAT</div>
      </div>
      <div class="days-grid" id="daysGrid"></div>
    </section>

    <!-- Gallery 視圖 -->
    <section class="gallery-card" id="galleryView" style="display:none;">
      <div class="gallery-header">
        <div class="gallery-month-badge" id="galleryMonthBadge">JAN</div>
        <div class="filter-tabs">
          <button class="filter-btn active" data-group="solo" title="具本奕個人/自拍">🐶</button>
          <button class="filter-btn" data-group="group" title="TEMPEST/隊友 (_t)">🌪️</button>
        </div>
      </div>
      <div class="gallery-grid" id="galleryGrid"></div>
    </section>
  </div>

  <div class="lightbox" id="lightbox" onclick="closeLightbox()">
    <div id="lightboxInner" onclick="event.stopPropagation()"></div>
  </div>

  <script>
    const MONTH_NAMES_EN = ['JAN', 'FEB', 'MAR', 'APR', 'MAY', 'JUN', 'JUL', 'AUG', 'SEP', 'OCT', 'NOV', 'DEC'];
    const params = new URLSearchParams(window.location.search);

    let currentYear = Number(params.get('year')) || 2026;
    let currentMonth = Number(params.get('month')) || 1; // 1~12
    let currentMode = params.get('view') === 'gallery' ? 'gallery' : 'calendar';
    let currentGroup = 'solo'; // 'solo' (🐶) 或 'group' (🌪️)

    let archiveData = { bubble: [], sns: [], media: [] };
    let dateActivityMap = {}; // '260117' -> Set(['bubble','sns','media'])

    const daysGrid = document.getElementById('daysGrid');
    const galleryGrid = document.getElementById('galleryGrid');
    const monthLabel = document.getElementById('monthLabel');
    const galleryMonthBadge = document.getElementById('galleryMonthBadge');
    const calendarView = document.getElementById('calendarView');
    const galleryView = document.getElementById('galleryView');
    const btnCalendarMode = document.getElementById('btnCalendarMode');
    const btnGalleryMode = document.getElementById('btnGalleryMode');

    function buildActivityMap() {
      dateActivityMap = {};
      ['bubble', 'sns', 'media'].forEach(cat => {
        (archiveData[cat] || []).forEach(item => {
          const d = String(item.date || '').trim();
          if (!d) return;
          if (!dateActivityMap[d]) dateActivityMap[d] = new Set();
          dateActivityMap[d].add(cat);
        });
      });
    }

    function isGroupMedia(filename) {
      // 檔名結尾含 _t（例如 xxx_t.jpg、xxx_t.mp4）歸為 🌪️ 團體/隊友
      const clean = String(filename || '').split('/').pop().toLowerCase();
      return /_t\.[a-z0-9]+$/.test(clean);
    }

    function guessMediaKind(path) {
      const lower = String(path || '').toLowerCase();
      if (lower.includes('_voice_') || lower.startsWith('voices/') || /\.(mp3|wav|m4a|ogg)$/.test(lower)) {
        return 'voice';
      }
      if (lower.endsWith('.mp4') || lower.includes('_video') || lower.includes('_story')) {
        return 'video';
      }
      return 'image';
    }

    function collectMonthMedia(yy, mm) {
      const prefix = yy + mm; // 例如 '2601'
      const collected = [];

      // 1. Bubble 媒體 / 語音
      (archiveData.bubble || []).forEach(item => {
        const d = String(item.date || '');
        if (!d.startsWith(prefix)) return;
        const asset = item.asset || (['image', 'voice', 'video'].includes(item.type) ? item.text_ko : '');
        if (!asset) return;
        const filename = asset.split('/').pop();
        const kind = item.type === 'voice' ? 'voice' : guessMediaKind(asset);
        collected.push({
          date: d,
          source: `Bubble · ${item.time || ''}`,
          filename,
          path: asset,
          kind,
          isGroup: isGroupMedia(filename)
        });
      });

      // 2. SNS 貼文與限動（Story）媒體
      (archiveData.sns || []).forEach(post => {
        const d = String(post.date || '');
        if (!d.startsWith(prefix)) return;
        const paths = post.media_paths && post.media_paths.length ? post.media_paths : (post.media || []);
        paths.forEach(p => {
          if (!p) return;
          const filename = p.split('/').pop();
          collected.push({
            date: d,
            source: post.platform || 'SNS',
            filename,
            path: p,
            kind: guessMediaKind(p),
            isGroup: isGroupMedia(filename)
          });
        });
      });

      // 去重（同日期同檔名同來源）
      const seen = new Set();
      return collected.filter(entry => {
        const key = `${entry.date}_${entry.filename}_${entry.source}`;
        if (seen.has(key)) return false;
        seen.add(key);
        return true;
      });
    }

    function renderHeaderState() {
      document.querySelectorAll('.year-pill').forEach(btn => {
        btn.classList.toggle('active', Number(btn.dataset.year) === currentYear);
      });
      monthLabel.textContent = `${currentYear} · ${currentMonth}月`;
      galleryMonthBadge.textContent = MONTH_NAMES_EN[currentMonth - 1];

      btnCalendarMode.classList.toggle('active', currentMode === 'calendar');
      btnGalleryMode.classList.toggle('active', currentMode === 'gallery');
      calendarView.style.display = currentMode === 'calendar' ? 'block' : 'none';
      galleryView.style.display = currentMode === 'gallery' ? 'block' : 'none';
    }

    function renderCalendar() {
      const yy = String(currentYear).slice(-2);
      const mm = String(currentMonth).padStart(2, '0');
      const firstDay = new Date(currentYear, currentMonth - 1, 1).getDay();
      const totalDays = new Date(currentYear, currentMonth, 0).getDate();

      let html = '';
      for (let i = 0; i < firstDay; i++) {
        html += `<div class="day-cell empty"></div>`;
      }

      for (let d = 1; d <= totalDays; d++) {
        const dd = String(d).padStart(2, '0');
        const yymmdd = yy + mm + dd;
        const cats = dateActivityMap[yymmdd];
        const isActive = Boolean(cats && cats.size > 0);
        const isBirthday = (currentMonth === 4 && d === 17);

        const birthdayClass = isBirthday ? ' birthday-day' : '';
        if (isActive) {
          const dotsHtml = Array.from(cats).map(() => `<span class="dot"></span>`).join('');
          html += `
            <a class="day-cell active${birthdayClass}" href="day.html?date=${yymmdd}">
              <span class="day-num">${d}</span>
              <div class="day-dots">${dotsHtml}</div>
            </a>
          `;
        } else {
          html += `
            <div class="day-cell inactive${birthdayClass}">
              <span class="day-num">${d}</span>
            </div>
          `;
        }
      }
      daysGrid.innerHTML = html;
    }

    function renderGallery() {
      const yy = String(currentYear).slice(-2);
      const mm = String(currentMonth).padStart(2, '0');
      const allMonthMedia = collectMonthMedia(yy, mm);

      const filtered = allMonthMedia.filter(item =>
        currentGroup === 'group' ? item.isGroup : !item.isGroup
      );

      if (!filtered.length) {
        galleryGrid.innerHTML = `<div class="empty-msg" style="grid-column:1/-1;">${currentYear}年${currentMonth}月此分類目前沒有媒體檔案</div>`;
        return;
      }

      galleryGrid.innerHTML = filtered.map(item => {
        let visualHtml = '';
        if (item.kind === 'video') {
          visualHtml = `<video src="${escapeAttr(item.path)}" controls preload="metadata" onclick="openLightbox('video', '${escapeAttr(item.path)}')"></video>`;
        } else if (item.kind === 'voice') {
          visualHtml = `
            <div class="voice-tile">
              <div style="font-size:1.4rem;">🎙️</div>
              <div style="font-size:0.78rem; color:#6e5d53; word-break:break-all;">${escapeHtml(item.filename)}</div>
              <audio src="${escapeAttr(item.path)}" controls></audio>
            </div>
          `;
        } else {
          visualHtml = `<img src="${escapeAttr(item.path)}" loading="lazy" alt="${escapeAttr(item.filename)}" onclick="openLightbox('image', '${escapeAttr(item.path)}')" />`;
        }

        return `
          <div class="media-tile">
            ${visualHtml}
            <div class="tile-meta">
              <span>${escapeHtml(item.date)} · ${escapeHtml(item.source)}</span>
              <a href="day.html?date=${escapeAttr(item.date)}">當日</a>
            </div>
          </div>
        `;
      }).join('');
    }

    function renderAll() {
      renderHeaderState();
      if (currentMode === 'calendar') renderCalendar();
      else renderGallery();
    }

    function openLightbox(kind, src) {
      const inner = document.getElementById('lightboxInner');
      if (kind === 'video') {
        inner.innerHTML = `<video src="${src}" controls autoplay></video>`;
      } else {
        inner.innerHTML = `<img src="${src}" alt="preview" />`;
      }
      document.getElementById('lightbox').classList.add('open');
    }

    function closeLightbox() {
      document.getElementById('lightbox').classList.remove('open');
      document.getElementById('lightboxInner').innerHTML = '';
    }

    function escapeHtml(s) {
      return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }
    function escapeAttr(s) {
      return String(s).replace(/"/g, '&quot;');
    }

    document.querySelectorAll('.year-pill').forEach(btn => {
      btn.addEventListener('click', () => {
        currentYear = Number(btn.dataset.year);
        renderAll();
      });
    });

    document.getElementById('prevMonth').addEventListener('click', () => {
      currentMonth--;
      if (currentMonth < 1) {
        currentMonth = 12;
        currentYear = Math.max(2022, currentYear - 1);
      }
      renderAll();
    });

    document.getElementById('nextMonth').addEventListener('click', () => {
      currentMonth++;
      if (currentMonth > 12) {
        currentMonth = 1;
        currentYear = Math.min(2026, currentYear + 1);
      }
      renderAll();
    });

    btnCalendarMode.addEventListener('click', () => {
      currentMode = 'calendar';
      renderAll();
    });

    btnGalleryMode.addEventListener('click', () => {
      currentMode = 'gallery';
      currentGroup = 'solo'; // 切進 Gallery 預設優先呈現 🐶
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.toggle('active', b.dataset.group === 'solo'));
      renderAll();
    });

    document.querySelectorAll('.filter-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        currentGroup = btn.dataset.group;
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        renderGallery();
      });
    });

    fetch('data.json')
      .then(r => r.json())
      .then(data => {
        archiveData = data;
        buildActivityMap();
        renderAll();
      })
      .catch(() => {
        buildActivityMap();
        renderAll();
      });
  </script>
</body>
</html>
