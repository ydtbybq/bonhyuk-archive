<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>혀기🐶 Archive - Calendar & Gallery</title>
  <style>
    :root {
      --bg: #fff8f2;
      --card: #ffffff;
      --orange: #ff944d;
      --orange-deep: #eb782d;
      --orange-soft: #fff0e3;
      --text: #2e2824;
      --muted: #9a8d84;
      --border: #f2e3d5;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", "Noto Sans SC", "Apple SD Gothic Neo", sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 20px 14px 64px;
    }
    .container {
      max-width: 780px;
      margin: 0 auto;
    }
    .top-bar {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
    }
    .back-link {
      text-decoration: none;
      color: var(--muted);
      font-weight: 700;
      font-size: 0.9rem;
    }
    .back-link:hover { color: var(--orange-deep); }
    .mode-switch {
      display: flex;
      gap: 8px;
    }
    .mode-btn {
      padding: 7px 14px;
      border-radius: 12px;
      border: 1.5px solid var(--border);
      background: var(--card);
      color: var(--text);
      font-weight: 700;
      font-size: 0.88rem;
      cursor: pointer;
    }
    .mode-btn.active {
      background: var(--orange);
      border-color: var(--orange);
      color: #fff;
    }

    .nav-panel {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 12px 16px;
      margin-bottom: 16px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .year-tabs {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }
    .year-pill {
      padding: 5px 11px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: #fffdfb;
      color: var(--text);
      font-weight: 700;
      font-size: 0.84rem;
      cursor: pointer;
    }
    .year-pill.active {
      background: var(--orange-soft);
      border-color: var(--orange);
      color: var(--orange-deep);
    }
    .month-controls {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .month-btn {
      width: 32px;
      height: 32px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      font-weight: 800;
      cursor: pointer;
    }
    .month-label {
      font-size: 1rem;
      font-weight: 800;
      min-width: 100px;
      text-align: center;
    }

    /* 月曆（已移除下方三點，保留生日標記） */
    .calendar-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 18px;
      box-shadow: 0 8px 24px rgba(255, 148, 77, 0.06);
    }
    .weekdays {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      text-align: center;
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--muted);
      margin-bottom: 8px;
    }
    .days-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 7px;
    }
    .day-cell {
      aspect-ratio: 1 / 1;
      border-radius: 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 0.95rem;
    }
    .day-cell.empty { background: transparent; }
    .day-cell.inactive {
      color: #d6ccc5;
      background: #fcfaf8;
    }
    .day-cell.active {
      background: var(--orange-soft);
      color: var(--text);
      border: 1px solid #ffd4b3;
      text-decoration: none;
      cursor: pointer;
    }
    .day-cell.active:hover {
      background: var(--orange);
      color: #fff;
    }
    .day-cell.birthday-day .day-num {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
    }
    .day-cell.birthday-day .day-num::after {
      content: "";
      width: 18px;
      height: 5px;
      border-radius: 999px;
      background: #ff7b29;
      margin-top: 3px;
    }

    /* Gallery 雙分類 */
    .gallery-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 18px;
      box-shadow: 0 8px 24px rgba(255, 148, 77, 0.06);
    }
    .gallery-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }
    .gallery-month-badge {
      font-size: 1.25rem;
      font-weight: 900;
      letter-spacing: 1px;
      color: var(--orange-deep);
      background: var(--orange-soft);
      padding: 5px 14px;
      border-radius: 12px;
    }
    .filter-tabs {
      display: flex;
      gap: 8px;
    }
    .filter-btn {
      padding: 6px 13px;
      border-radius: 12px;
      border: 1.5px solid var(--border);
      background: #fffdfb;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
    }
    .filter-btn.active {
      background: var(--orange);
      border-color: var(--orange);
      color: #fff;
    }

    /* 桌機版 Gallery 網格 */
    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(185px, 1fr));
      gap: 12px;
    }
    .media-tile {
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
      background: #fffdfb;
      display: flex;
      flex-direction: column;
    }
    .media-tile img, .media-tile video {
      width: 100%;
      height: 175px;
      object-fit: cover;
      display: block;
      background: #f5ece6;
      cursor: pointer;
    }
    .voice-tile {
      height: 175px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px;
      background: var(--orange-soft);
    }
    .voice-tile audio {
      width: 100%;
      height: 32px;
    }
    .tile-meta {
      padding: 8px 10px;
      font-size: 0.78rem;
      color: var(--muted);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
    }
    .tile-meta a {
      color: var(--orange-deep);
      text-decoration: none;
      font-weight: 700;
    }

    /* 手機版專屬：純媒體 3 欄緊湊網格 */
    @media (max-width: 768px) {
      body { padding: 12px 8px 64px; }
      .gallery-card {
        padding: 12px;
        border-radius: 18px;
      }
      .gallery-grid {
        grid-template-columns: repeat(3, 1fr);
        gap: 4px;
      }
      .media-tile {
        border: none;
        border-radius: 6px;
        aspect-ratio: 1 / 1;
        position: relative;
      }
      .media-tile img, .media-tile video {
        width: 100%;
        height: 100%;
        aspect-ratio: 1 / 1;
        border-radius: 6px;
      }
      .voice-tile {
        height: 100%;
        aspect-ratio: 1 / 1;
        padding: 6px;
        gap: 4px;
      }
      .voice-tile .voice-fname { display: none; }
      .tile-meta { display: none; }
    }

    .empty-msg {
      text-align: center;
      color: var(--muted);
      padding: 36px 12px;
      font-size: 0.92rem;
    }

    /* 燈箱 */
    .lightbox {
      position: fixed;
      inset: 0;
      background: rgba(14, 14, 16, 0.92);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      z-index: 120;
      padding: 16px;
    }
    .lightbox.open { display: flex; }
    .lb-top {
      width: 100%;
      max-width: 680px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .lb-icon-btn {
      background: rgba(255, 255, 255, 0.14);
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 999px;
      padding: 7px 14px;
      font-size: 0.95rem;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
    }
    .lb-body {
      flex: 1;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      padding: 12px 0;
    }
    .lb-body img, .lb-body video {
      max-width: 94vw;
      max-height: 74vh;
      border-radius: 12px;
      object-fit: contain;
    }
    .lb-bottom-info {
      width: 100%;
      max-width: 680px;
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 14px;
      padding: 11px 16px;
      color: #ffffff;
      text-decoration: none;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.9rem;
      font-weight: 700;
    }
    .lb-bottom-info:hover {
      background: var(--orange);
      border-color: var(--orange);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="top-bar">
      <a class="back-link" href="years.html">← Years</a>
      <div class="mode-switch">
        <button class="mode-btn active" id="btnCalendarMode">Calendar</button>
        <button class="mode-btn" id="btnGalleryMode">Gallery</button>
      </div>
    </div>

    <div class="nav-panel">
      <div class="year-tabs" id="yearTabs">
        <button class="year-pill" data-year="2022">2022</button>
        <button class="year-pill" data-year="2023">2023</button>
        <button class="year-pill" data-year="2024">2024</button>
        <button class="year-pill" data-year="2025">2025</button>
        <button class="year-pill" data-year="2026">2026</button>
      </div>
      <div class="month-controls">
        <button class="month-btn" id="prevMonth">‹</button>
        <div class="month-label" id="monthLabel">2026 · 1月</div>
        <button class="month-btn" id="nextMonth">›</button>
      </div>
    </div>

    <!-- Calendar 視圖 -->
    <section class="calendar-card" id="calendarView">
      <div class="weekdays">
        <div>SUN</div><div>MON</div><div>TUE</div><div>WED</div><div>THU</div><div>FRI</div><div>SAT</div>
      </div>
      <div class="days-grid" id="daysGrid"></div>
    </section>

    <!-- Gallery 視圖 -->
    <section class="gallery-card" id="galleryView" style="display:none;">
      <div class="gallery-header">
        <div class="gallery-month-badge" id="galleryMonthBadge">JAN</div>
        <div class="filter-tabs">
          <button class="filter-btn active" data-group="solo" title="Solo (🐶)">🐶</button>
          <button class="filter-btn" data-group="group" title="Group / Teammate (_t) (🌪️)">🌪️</button>
        </div>
      </div>
      <div class="gallery-grid" id="galleryGrid"></div>
    </section>
  </div>

  <!-- 燈箱 -->
  <div class="lightbox" id="lightbox" onclick="closeLightbox()">
    <div class="lb-top" onclick="event.stopPropagation()">
      <button class="lb-icon-btn" onclick="closeLightbox()">✕</button>
      <a class="lb-icon-btn" id="lbDownloadBtn" download title="下載">↓</a>
    </div>
    <div class="lb-body" id="lightboxInner" onclick="event.stopPropagation()"></div>
    <a class="lb-bottom-info" id="lbDayLink" href="#" onclick="event.stopPropagation()">
      <span id="lbMetaText"></span>
      <span>›</span>
    </a>
  </div>

  <script>
    const MONTH_NAMES_EN = ['JAN', 'FEB', 'MAR', 'APR', 'MAY', 'JUN', 'JUL', 'AUG', 'SEP', 'OCT', 'NOV', 'DEC'];
    const params = new URLSearchParams(window.location.search);

    let currentYear = Number(params.get('year')) || 2026;
    let currentMonth = Number(params.get('month')) || 1;
    let currentMode = params.get('view') === 'gallery' ? 'gallery' : 'calendar';
    let currentGroup = 'solo';

    let archiveData = { bubble: [], sns: [], media: [] };
    let dateActivityMap = {};

    const daysGrid = document.getElementById('daysGrid');
    const galleryGrid = document.getElementById('galleryGrid');
    const monthLabel = document.getElementById('monthLabel');
    const galleryMonthBadge = document.getElementById('galleryMonthBadge');
    const calendarView = document.getElementById('calendarView');
    const galleryView = document.getElementById('galleryView');
    const btnCalendarMode = document.getElementById('btnCalendarMode');
    const btnGalleryMode = document.getElementById('btnGalleryMode');

    function normDate(d) {
      return String(d || '').replace(/\D/g, '').trim();
    }

    function formatDotDate(yymmdd) {
      if (!/^\d{6}$/.test(yymmdd)) return yymmdd;
      return `${yymmdd.slice(0, 2)}.${yymmdd.slice(2, 4)}.${yymmdd.slice(4, 6)}`;
    }

    function buildActivityMap() {
      dateActivityMap = {};
      ['bubble', 'sns', 'media'].forEach(cat => {
        (archiveData[cat] || []).forEach(item => {
          const d = normDate(item.date);
          if (!d) return;
          if (!dateActivityMap[d]) dateActivityMap[d] = new Set();
          dateActivityMap[d].add(cat);
        });
      });
    }

    function isGroupMedia(filename) {
      const clean = String(filename || '').split('/').pop().toLowerCase();
      return /_t\.[a-z0-9]+$/.test(clean);
    }

    function guessMediaKind(path) {
      const lower = String(path || '').toLowerCase();
      if (lower.includes('_voice_') || lower.startsWith('voices/') || /\.(mp3|wav|m4a|ogg)$/.test(lower)) {
        return 'voice';
      }
      if (lower.endsWith('.mp4') || lower.includes('_video') || lower.includes('_story')) {
        return 'video';
      }
      return 'image';
    }

    function collectMonthMedia(yy, mm) {
      const prefix = yy + mm;
      const collected = [];

      (archiveData.bubble || []).forEach((item, idx) => {
        const d = normDate(item.date);
        if (!d.startsWith(prefix)) return;
        const asset = item.asset || (['image', 'voice', 'video'].includes(item.type) ? item.text_ko : '');
        if (!asset) return;
        const filename = String(asset).split('/').pop();
        const kind = item.type === 'voice' ? 'voice' : guessMediaKind(asset);
        collected.push({
          date: d,
          order: idx,
          sourceLabel: 'Bubble',
          filename,
          path: asset,
          kind,
          isGroup: isGroupMedia(filename)
        });
      });

      (archiveData.sns || []).forEach((post, idx) => {
        const d = normDate(post.date);
        if (!d.startsWith(prefix)) return;
        const paths = post.media_paths && post.media_paths.length ? post.media_paths : (post.media || []);
        paths.forEach((p, pIdx) => {
          if (!p) return;
          const filename = String(p).split('/').pop();
          collected.push({
            date: d,
            order: 10000 + idx * 50 + pIdx,
            sourceLabel: post.platform || 'SNS',
            filename,
            path: p,
            kind: guessMediaKind(p),
            isGroup: isGroupMedia(filename)
          });
        });
      });

      // 由舊到新排序
      collected.sort((a, b) => {
        if (a.date !== b.date) return a.date.localeCompare(b.date);
        return a.order - b.order;
      });

      const seen = new Set();
      return collected.filter(entry => {
        const key = `${entry.date}_${entry.filename}_${entry.sourceLabel}`;
        if (seen.has(key)) return false;
        seen.add(key);
        return true;
      });
    }

    function renderHeaderState() {
      document.querySelectorAll('.year-pill').forEach(btn => {
        btn.classList.toggle('active', Number(btn.dataset.year) === currentYear);
      });
      monthLabel.textContent = `${currentYear} · ${currentMonth}月`;
      galleryMonthBadge.textContent = MONTH_NAMES_EN[currentMonth - 1];

      btnCalendarMode.classList.toggle('active', currentMode === 'calendar');
      btnGalleryMode.classList.toggle('active', currentMode === 'gallery');
      calendarView.style.display = currentMode === 'calendar' ? 'block' : 'none';
      galleryView.style.display = currentMode === 'gallery' ? 'block' : 'none';
    }

    function renderCalendar() {
      const yy = String(currentYear).slice(-2);
      const mm = String(currentMonth).padStart(2, '0');
      const firstDay = new Date(currentYear, currentMonth - 1, 1).getDay();
      const totalDays = new Date(currentYear, currentMonth, 0).getDate();

      let html = '';
      for (let i = 0; i < firstDay; i++) {
        html += `<div class="day-cell empty"></div>`;
      }

      for (let d = 1; d <= totalDays; d++) {
        const dd = String(d).padStart(2, '0');
        const yymmdd = yy + mm + dd;
        const cats = dateActivityMap[yymmdd];
        const isActive = Boolean(cats && cats.size > 0);
        const isBirthday = (currentMonth === 4 && d === 17);
        const bClass = isBirthday ? ' birthday-day' : '';

        if (isActive) {
          html += `
            <a class="day-cell active${bClass}" href="day.html?date=${yymmdd}">
              <span class="day-num">${d}</span>
            </a>
          `;
        } else {
          html += `
            <div class="day-cell inactive${bClass}">
              <span class="day-num">${d}</span>
            </div>
          `;
        }
      }
      daysGrid.innerHTML = html;
    }

    function renderGallery() {
      const yy = String(currentYear).slice(-2);
      const mm = String(currentMonth).padStart(2, '0');
      const allMonthMedia = collectMonthMedia(yy, mm);
      const filtered = allMonthMedia.filter(item =>
        currentGroup === 'group' ? item.isGroup : !item.isGroup
      );

      if (!filtered.length) {
        galleryGrid.innerHTML = `<div class="empty-msg" style="grid-column:1/-1;">${currentYear}.${mm} — Empty</div>`;
        return;
      }

      galleryGrid.innerHTML = filtered.map(item => {
        const payload = encodeURIComponent(JSON.stringify({
          kind: item.kind,
          path: item.path,
          filename: item.filename,
          sourceLabel: item.sourceLabel,
          date: item.date
        }));

        let visualHtml = '';
        if (item.kind === 'video') {
          visualHtml = `<video src="${escapeAttr(item.path)}" preload="metadata" onclick="openLightboxByPayload('${payload}')"></video>`;
        } else if (item.kind === 'voice') {
          visualHtml = `
            <div class="voice-tile" onclick="openLightboxByPayload('${payload}')">
              <div style="font-size:1.35rem;">🎙️</div>
              <div class="voice-fname" style="font-size:0.75rem; color:#6e5d53; word-break:break-all;">${escapeHtml(item.filename)}</div>
              <audio src="${escapeAttr(item.path)}" controls onclick="event.stopPropagation()"></audio>
            </div>
          `;
        } else {
          visualHtml = `<img src="${escapeAttr(item.path)}" loading="lazy" alt="" onclick="openLightboxByPayload('${payload}')" />`;
        }

        return `
          <div class="media-tile">
            ${visualHtml}
            <div class="tile-meta">
              <span>${escapeHtml(formatDotDate(item.date))} · ${escapeHtml(item.sourceLabel)}</span>
              <a href="day.html?date=${escapeAttr(item.date)}">Day</a>
            </div>
          </div>
        `;
      }).join('');
    }

    window.openLightboxByPayload = function(encoded) {
      const item = JSON.parse(decodeURIComponent(encoded));
      const inner = document.getElementById('lightboxInner');
      const dlBtn = document.getElementById('lbDownloadBtn');
      const dayLink = document.getElementById('lbDayLink');
      const metaText = document.getElementById('lbMetaText');

      if (item.kind === 'video') {
        inner.innerHTML = `<video src="${escapeAttr(item.path)}" controls autoplay></video>`;
      } else if (item.kind === 'voice') {
        inner.innerHTML = `<div style="background:#fff0e3; padding:24px; border-radius:18px; text-align:center;"><div style="font-size:2rem; margin-bottom:10px;">🎙️</div><audio src="${escapeAttr(item.path)}" controls autoplay></audio></div>`;
      } else {
        inner.innerHTML = `<img src="${escapeAttr(item.path)}" alt="" />`;
      }

      dlBtn.href = item.path;
      dlBtn.setAttribute('download', item.filename || 'media');
      metaText.textContent = `${item.sourceLabel} • ${formatDotDate(item.date)}`;
      dayLink.href = `day.html?date=${item.date}`;

      document.getElementById('lightbox').classList.add('open');
    };

    window.closeLightbox = function() {
      document.getElementById('lightbox').classList.remove('open');
      document.getElementById('lightboxInner').innerHTML = '';
    };

    function renderAll() {
      renderHeaderState();
      if (currentMode === 'calendar') renderCalendar();
      else renderGallery();
    }

    function escapeHtml(s) {
      return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }
    function escapeAttr(s) {
      return String(s || '').replace(/"/g, '&quot;');
    }

    document.querySelectorAll('.year-pill').forEach(btn => {
      btn.addEventListener('click', () => {
        currentYear = Number(btn.dataset.year);
        renderAll();
      });
    });

    document.getElementById('prevMonth').addEventListener('click', () => {
      currentMonth--;
      if (currentMonth < 1) {
        currentMonth = 12;
        currentYear = Math.max(2022, currentYear - 1);
      }
      renderAll();
    });

    document.getElementById('nextMonth').addEventListener('click', () => {
      currentMonth++;
      if (currentMonth > 12) {
        currentMonth = 1;
        currentYear = Math.min(2026, currentYear + 1);
      }
      renderAll();
    });

    btnCalendarMode.addEventListener('click', () => {
      currentMode = 'calendar';
      renderAll();
    });

    btnGalleryMode.addEventListener('click', () => {
      currentMode = 'gallery';
      currentGroup = 'solo';
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.toggle('active', b.dataset.group === 'solo'));
      renderAll();
    });

    document.querySelectorAll('.filter-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        currentGroup = btn.dataset.group;
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        renderGallery();
      });
    });

    fetch('data.json')
      .then(r => r.json())
      .then(data => {
        archiveData = data;
        buildActivityMap();
        renderAll();
      })
      .catch(() => {
        buildActivityMap();
        renderAll();
      });
  </script>
</body>
</html>
